<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
    <style>
        @page {
            size: A4;
            margin: 2cm;
        }
        body { 
            font-family: Helvetica, Arial, sans-serif; 
            color: #1E2B22; 
            line-height: 1.5; 
        }
        .eyebrow { 
            color: #E2632A; 
            font-weight: bold; 
            font-size: 12px; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
        }
        h1 { 
            color: #2F4B3C; 
            font-size: 28px; 
            margin-top: 0; 
            margin-bottom: 5px; 
        }
        .subtitle { 
            color: #7C9083; 
            font-size: 14px; 
            margin-bottom: 30px; 
            border-bottom: 1px solid #7C9083;
            padding-bottom: 10px;
        }
        h2, h3, h4 { 
            color: #2F4B3C; 
            margin-top: 20px; 
            margin-bottom: 10px; 
        }
        ul, ol { 
            margin-left: 20px; 
            padding-left: 0; 
        }
        li { 
            margin-bottom: 8px; 
        }
        li::marker { 
            color: #E2632A; 
            font-weight: bold; 
        }
        pre, code {
            font-family: Courier, monospace;
            background-color: #f4f4f4;
            padding: 2px 4px;
            border-radius: 4px;
        }
        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="eyebrow">TRAILMARK</div>
    <h1>{{ title }}</h1>
    <div class="subtitle">{{ subtitle|safe }}</div>
    
    <div class="content">
        {{ html_body|safe }}
    </div>
</body>
</html>
